COM_OFFER_AGREEMENT_CONTENT="J'accepte de souscrire une garantie de loyer auprès de goCaution conformément à la présente offre et l'autorise à effectuer les démarches nécessaires, notamment auprès d'un éventuel assureur précédent, et à établir une nouvelle police de garantie de loyer pour moi et mon bailleur. A cet effet, j'autorise goCaution à transmettre mes données personnelles et d'assurance aux instances impliquées (bailleur, partenaire de risque). Je suis conscient(e) qu'en tant que locataire principal, il m'incombe d'informer les autres locataires impliqués de ce processus.<br /><br /><b>Je confirme avoir lu et compris les <a href='https://docs.gocaution.ch/fr/terms/052024/conditions-generales-cga.pdf' target='_blank'>conditions générales d'assurance (CGA)</a> et les informations qu'elles contiennent conformément à l'<a href='https://www.admin.ch/opc/fr/classified-compilation/19080008/index.html#a3' target='_blank'>article 3 de la loi sur le contrat d'assurance (LCA)</a>, <a href='https://docs.gocaution.ch/fr/legal/lsa-45.pdf' target='_blank'>la fiche d'information client selon l'art. 45 LSA</a> ainsi que les indications relatives à la <a href='https://www.gocaution.ch/fr/politique-de-confidentialite' target='_blank'>protection des données</a>.</b>"

