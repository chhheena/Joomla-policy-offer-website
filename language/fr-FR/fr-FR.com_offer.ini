COM_OFFER_FAQ_MODAL_HEAD_CONTENT="Voici les réponses aux questions que vous vous posez peut-être"
COM_OFFER_FAQ_MODAL_HEAD_CONTENT_DESC="En cas de questions ou d'incertitudes, nous sommes bien entendu à votre disposition par E-mail ou par téléphone au 0800 461 461. Nous répondons également aux demandes par e-mail à info@gocaution.ch en dehors des heures de bureau"
COM_OFFER_FAQ_MODAL_QUES_ONE="Comment fonctionne la garantie de loyer goCaution ?"
COM_OFFER_FAQ_MODAL_ANS_ONE="Traditionnellement, le locataire verse la garantie de loyer exigée par le bailleur sur un compte bloqué auprès d'une banque suisse. Cet argent reste ainsi immobilisé pendant la durée du bail et est incessible aussi bien pour le locataire que pour le bailleur. En optant pour l'assurance de garantie de loyer, le versement en espèce de la garantie de loyer n'est plus nécessaire. Contre le paiement d'une prime annuelle, goCaution fournit au bailleur une attestation qui assure le montant de la garantie de loyer exigée. De même que pour le dépôt bancaire traditionnel, l'accord du locataire et du bailleur sont nécessaires pour la libération de l'attestation de garantie"
COM_OFFER_FAQ_MODAL_QUES_TWO="À quels moments puis-je conclure une caution de loyer goCaution ?"
COM_OFFER_FAQ_MODAL_ANS_TWO="Vous pouvez faire appel à notre service de garantie de loyer lors d'un déménagement dans un nouveau logement mais également à tout moment dans le cadre d'un bail en cours pour libérer une garantie bancaire déjà déposée ou changer de prestataire pour votre garantie de loyer."
COM_OFFER_FAQ_MODAL_QUES_THREE="Quelles sont les relations contractuelles qui naissent de la conclusion de la garantie de loyer goCaution® ?"
COM_OFFER_FAQ_MODAL_ANS_THREE="Il existe un contrat de coopération entre goCaution et son porteur de risque, UNIQA Assurance, concernant la couverture de la garantie de loyer proposée ici. goCaution est un prestataire de services d'assurance lié au sens de la législation suisse sur la surveillance des assurances, mais il exploite son propre produit et gère toutes les prestations de l'assurance de garantie de loyer de manière indépendante. goCaution et UNIQA bénéficient ensemble des primes générées et en contrepartie de la prime annuelle, un contrat d'assurance est conclu entre vous et goCaution/UNIQA qui garantit à votre bailleur la couverture de la caution de loyer exigée. Les conditions générales que vous acceptez à la conclusion du contrat prévoient que seul goCaution se charge de fournir les prestations au client et à son bailleur."
COM_OFFER_FAQ_MODAL_QUES_FOUR="Y a-t-il une durée minimale pour l'assurance de cautionnement ?"
COM_OFFER_FAQ_MODAL_ANS_FOUR="Non. Notre assurance de cautionnement peut être résiliée à tout moment, à condition que vous fournissiez à votre bailleur une garantie équivalente en remplacement du certificat de goCaution. A la fin du bail, la police de cautionnement prend fin lorsque votre bailleur nous restitue le certificat de cautionnement en sa possession. Si l'assurance de cautionnement est résiliée au cours des 12 premiers mois, un remboursement proportionnel de la prime ne sera pas proposé. L'octroi d'un remboursement proportionnel n'est possible qu'à partir de la deuxième année d'assurance."
COM_OFFER_FAQ_MODAL_QUES_FIVE="Comment résilier la garantie de loyer goCaution ?"
COM_OFFER_FAQ_MODAL_ANS_FIVE="En cas de départ du logement, vous n'avez en principe rien à faire pour résilier la garantie de loyer, car celle-ci ne peut être libérée que par le bailleur. Le bailleur procède à la résiliation soit en nous retournant le certificat de caution rempli et signé par e-mail ou par courrier, soit en nous confirmant la libération depuis notre portail en ligne. De même, si vous souhaitez remplacer une garantie existante, comme un dépôt bancaire ou un certificat de caution d'un autre prestataire, par un certificat de caution de goCaution, vous n'aurez pas de démarche supplémentaire a effectuer car après la transmission du nouveau certificat de caution, goCaution prend directement contact avec le bailleur et organise pour vous la libération de la garantie à résilier."
COM_OFFER_FAQ_MODAL_QUES_SIX="Que se passe-t-il en cas de sinistre ?"
COM_OFFER_FAQ_MODAL_ANS_SIX="Après la restitution du logement, si le bailleur a des prétentions découlant du contrat de bail à faire valoir, il peut être indemnisé par le biais de la garantie de loyer. Pour en faire la demande, le bailleur nous renvoie le certificat de caution signé par lui même et par le locataire, accompagné du décompte final et d'une copie du contrat de location. Nous examinons les documents et versons le montant du dommage (au maximum le montant de la caution) au bailleur. En qualité de caution simple, le locataire est ensuite tenu de rembourser à goCaution les prestations versées au bailleur."
COM_OFFER_FAQ_MODAL_QUES_SEVEN="Garantie de remboursement"
COM_OFFER_FAQ_MODAL_ANS_SEVEN="Il peut arriver que l'assurance de garantie de loyer souscrite chez nous n'entre pas en vigueur et il peut y avoir différentes raisons à cela. En voici quelques-uns : Votre bailleur n'accepte pas la garantie de loyer sous forme de cautionnement et exige qu'un dépôt soit effectué auprès d'une banque, ou votre bailleur accepte la garantie de loyer sous forme de cautionnement mais préfère un autre prestataire. Dans de tels cas, nous vous remboursons intégralement la prime versée. Pour cela, il suffit que votre bailleur libère le certificat de caution que nous lui avons envoyé en nous informant par écrit que la caution de loyer goCauiton n'est pas nécessaire. Une résiliation écrite de votre part n'est pas nécessaire."
COM_OFFER_FAQ_MODAL_QUES_EIGHT="Comment mes données personnelles sont-elles traitées ?"
COM_OFFER_FAQ_MODAL_ANS_EIGHT="Les données collectées auprès des personnes physiques qui sont parties au contrat d'assurance sont traitées par goCaution et conservées sous forme électronique protégée. Ces données sont notamment utilisées pour déterminer le taux de prime, pour l'évaluation des risques, pour le traitement des sinistres, pour les analyses statistiques et à des fins publicitaires. Les données collectées peuvent, le cas échéant et lorsque cela est nécessaire, être transmises aux tiers participant à l'exécution du contrat en Suisse et à l'étranger, notamment aux porteurs de risques et aux entreprises liées par un contrat de traitement des commandes. En outre, goCaution peut demander des informations pertinentes aux autorités, aux agences de renseignements et à d'autres tiers, notamment sur la moralité de paiement du locataire et l'évolution des sinistres. Des informations détaillées sur le traitement des données sont contenues dans la déclaration de protection des données de goCaution. La version en vigueur peut être consultée sur www.gocaution.ch/fr/politique-de-confidentialite."
COM_OFFER_FAQ_MODAL_QUES_NINE="Pourquoi une vérification de la solvabilité est-elle effectuée ?"
COM_OFFER_FAQ_MODAL_ANS_NINE="Nous procédons à un contrôle de solvabilité afin de déterminer votre capacité de paiement. Elle est intégrée dans le processus de demande et constitue une condition de base pour l'octroi d'une garantie de loyer. Dans le respect de toutes les dispositions légales relatives à la protection des données, nous procédons, après votre demande, à la collecte de renseignements sur les poursuites et sur la situation économique auprès de prestataires tiers."
COM_OFFER_FAQ_MODAL_QUES_TEN="Qui est le partenaire de risque de goCaution et qu'est-ce qui le caractérise ?"
COM_OFFER_FAQ_MODAL_ANS_TEN="L'assurance UNIQA est une compagnie d'assurance leader en Europe centrale et orientale et possède une longue histoire qui remonte à 1811. Le groupe UNIQA propose une large gamme de produits et de services d'assurance aux particuliers, aux entreprises et aux institutions. Avec UNIQA Liechtenstein, en tant que première compagnie d'assurance liechtensteinoise, nous avons trouvé un porteur de risques agile qui soutient le développement de goCaution et permet également l'entrée sur le marché dans d'autres pays."

