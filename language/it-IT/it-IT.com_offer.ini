COM_OFFER_NOTIFICATION_TITLE="Tre motivi per cui dovreste decidere di passare a Uniqa Versicherung e rimanere con goCaution:"
COM_OFFER_NOTIFICATION_DESC="<ul><li>I nostri servizi, le tariffe e i termini e le condizioni sono rimasti invariati o migliorati dalla fondazione di goCaution. E così sarà anche in futuro. Di conseguenza, per voi non cambierà nulla.</li><li>goCaution è apprezzato da inquilini e proprietari per la semplicità dei suoi processi e, con oltre 2.600 eccellenti recensioni online, è il fornitore di depositi cauzionali più popolare in Svizzera.</li><li>goCaution rimane il vostro partner di deposito a lungo termine e si occupa di tutto ciò che è necessario per garantire che l'adeguamento del contratto avvenga senza complicazioni e senza spese aggiuntive per voi.</li></ul>"

COM_OFFER_FAQ_MODAL_HEAD_CONTENT="Risposte alle vostre domande"
COM_OFFER_FAQ_MODAL_HEAD_CONTENT_DESC="Per qualsiasi domanda o richiesta, non esitate a contattarci via o per telefono al numero 0800 461 461. Rispondiamo anche alle domande via e-mail all'indirizzo info@gocaution.ch al di fuori degli orari di ufficio."
COM_OFFER_FAQ_MODAL_QUES_ONE="Qual è il principio del deposito cauzionale goCaution?"
COM_OFFER_FAQ_MODAL_ANS_ONE="Di norma, l'inquilino versa il deposito cauzionale richiesto dal locatore su un conto bloccato presso una banca svizzera. Questo denaro rimane bloccato fino alla cancellazione dell'immobile in affitto ed è intoccabile sia per l'inquilino che per il proprietario. Con l'assicurazione del deposito cauzionale, invece, non è necessario pagare il deposito cauzionale, perché in cambio del pagamento di un premio annuale, il locatore riceve un certificato di deposito cauzionale che assicura il deposito cauzionale richiesto. Come nel caso del tradizionale deposito per l'affitto, per il rilascio dell'assicurazione del deposito è necessaria l'approvazione dell'inquilino e del locatore."
COM_OFFER_FAQ_MODAL_QUES_TWO="In quali fasi posso stipulare una garanzia di affitto goCaution?"
COM_OFFER_FAQ_MODAL_ANS_TWO="Potete utilizzare il nostro servizio di garanzia di affitto quando vi trasferite in un nuovo appartamento, oppure per svincolare un deposito bancario esistente o modificare un'assicurazione di garanzia di affitto esistente."
COM_OFFER_FAQ_MODAL_QUES_THREE="Quali rapporti contrattuali si instaurano con la stipula della garanzia di noleggio goCaution®?"
COM_OFFER_FAQ_MODAL_ANS_THREE="Esiste un accordo di cooperazione tra goCaution e il suo assicuratore di rischio, UNIQA Versicherung, per quanto riguarda l'assicurazione della garanzia di noleggio qui offerta. goCaution è un fornitore di servizi assicurativi vincolati ai sensi della legislazione svizzera in materia di vigilanza sulle assicurazioni, ma gestisce un prodotto proprio e offre tutti i servizi assicurativi di garanzia di noleggio in modo indipendente. goCaution e UNIQA partecipano congiuntamente ai premi generati. Al momento della stipula del contratto, goCaution o UNIQA stipulano un contratto di assicurazione che garantisce al locatore una fideiussione per il deposito cauzionale richiesto. Il contratto stesso, che il cliente stipula accettando le nostre Condizioni generali di assicurazione, stabilisce che solo goCaution è responsabile della fornitura del servizio al cliente e al suo locatore. In cambio, il cliente si impegna a pagarci il premio"
COM_OFFER_FAQ_MODAL_QUES_FOUR="Esistono condizioni minime per l'assicurazione del deposito cauzionale?"
COM_OFFER_FAQ_MODAL_ANS_FOUR="No, fondamentalmente no. La nostra assicurazione sul deposito cauzionale può essere annullata in qualsiasi momento se il locatore è in grado di fornire un altro deposito cauzionale equivalente per il contratto di locazione o se il contratto di locazione viene risolto. La garanzia scade quando il locatore ci restituisce il documento. Se l'assicurazione del deposito cauzionale viene annullata entro i primi 12 mesi, non rimborseremo il premio. Il rimborso è proporzionale solo a partire dal secondo anno di assicurazione"
COM_OFFER_FAQ_MODAL_QUES_FIVE="Come posso annullare la garanzia di affitto goCaution?"
COM_OFFER_FAQ_MODAL_ANS_FIVE="Quando si lascia l'appartamento, non è necessario fare nulla per annullare la garanzia del deposito cauzionale per l'affitto, poiché può essere svincolata solo dal locatore. Non è necessaria la classica lettera di disdetta, come avviene per altri prodotti assicurativi. Il locatore annulla la polizza inviandoci il certificato di deposito compilato e firmato per e-mail o per posta, oppure autorizzandoci nel nostro portale del locatore, liberandoci così dal nostro obbligo. Anche se desiderate sostituire un deposito cauzionale esistente, come un deposito bancario o un certificato di deposito cauzionale di un altro fornitore, con un certificato di deposito cauzionale di goCaution, non dovrete sostenere alcuna spesa importante. Questo perché goCaution contatta direttamente il locatore dopo l'invio del nuovo certificato di deposito cauzionale e organizza per voi lo svincolo dell'attuale deposito cauzionale"
COM_OFFER_FAQ_MODAL_QUES_SIX="Cosa succede in caso di danni?"
COM_OFFER_FAQ_MODAL_ANS_SIX="Se, dopo la consegna dell'immobile in affitto, il locatore fa valere dei crediti derivanti dalla locazione che devono essere compensati con il deposito cauzionale goCaution, il locatore deve notificare il credito al locatore. A tal fine, il locatore ci restituisce il certificato di deposito firmato da entrambe le parti insieme al rendiconto finale e a una copia del contratto di locazione. Noi controlliamo i documenti e paghiamo al locatore l'importo della richiesta (fino all'ammontare del deposito concordato). In seguito, recuperiamo dall'inquilino l'importo versato al locatore"
COM_OFFER_FAQ_MODAL_QUES_SEVEN="Garanzia di rimborso"
COM_OFFER_FAQ_MODAL_ANS_SEVEN="Può succedere che l'assicurazione del deposito cauzionale stipulata con noi non abbia effetto. I motivi possono essere diversi. Ecco alcuni esempi: Il vostro locatore in genere non accetta il deposito cauzionale senza contanti e insiste per un deposito cauzionale presso una banca, oppure il vostro locatore accetta il deposito cauzionale senza contanti ma preferisce un altro fornitore. In questo caso, vi rimborseremo interamente il premio versato. Il locatore non deve fare altro che rilasciare il certificato di deposito da noi inviato, comunicandoci per iscritto che il deposito cauzionale goCauiton non è richiesto. Non è necessaria una disdetta scritta da parte vostra"
COM_OFFER_FAQ_MODAL_QUES_EIGHT="Come vengono trattati i dati personali?"
COM_OFFER_FAQ_MODAL_ANS_EIGHT="I dati raccolti dalle persone fisiche che sono parti del contratto di assicurazione sono trattati da goCaution e archiviati elettronicamente e in modo sicuro. Questi dati vengono utilizzati in particolare per determinare il premio, per chiarire i rischi, per elaborare i sinistri, per analisi statistiche e per scopi pubblicitari. I dati raccolti possono essere trasmessi, nella misura necessaria, a terzi coinvolti nell'esecuzione del contratto in Svizzera e all'estero, in particolare ai vettori del rischio e alle società affiliate in base a un accordo di elaborazione degli ordini. Inoltre, goCaution può ottenere informazioni pertinenti dalle autorità, dalle agenzie di credito e da altri terzi, in particolare sul comportamento di pagamento del locatario e sullo storico dei sinistri. Informazioni dettagliate sul trattamento dei dati sono disponibili nell'informativa sulla privacy di goCaution. La versione attualmente in vigore è disponibile sul sito www.gocaution.ch/datenschutz"
COM_OFFER_FAQ_MODAL_QUES_NINE="Perché viene effettuata una verifica della solvibilità?"
COM_OFFER_FAQ_MODAL_ANS_NINE="Effettuiamo un controllo del credito per determinare la vostra solvibilità. È integrato nel processo di richiesta ed è un requisito fondamentale per la concessione di una garanzia di deposito per l'affitto. Nel rispetto di tutte le norme sulla protezione dei dati, dopo l'inoltro della domanda otteniamo da fornitori terzi i rapporti di credito e di esecuzione del debito."
COM_OFFER_FAQ_MODAL_QUES_TEN="Chi è il partner di rischio di goCaution e cosa lo caratterizza?"
COM_OFFER_FAQ_MODAL_ANS_TEN="UNIQA Versicherung è una compagnia assicurativa leader nell'Europa centrale e orientale e vanta una lunga storia che risale al 1811. Il Gruppo UNIQA offre un'ampia gamma di prodotti e servizi assicurativi per privati, aziende e istituzioni. Con UNIQA Liechtenstein, in qualità di prima compagnia assicurativa del Liechtenstein, abbiamo trovato un vettore di rischio agile che sostiene l'ulteriore sviluppo di goCaution e ci permette di entrare nel mercato anche in altri Paesi."

