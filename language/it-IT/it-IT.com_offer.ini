COM_OFFER_AGREEMENT_CONTENT="Accetto di sottoscrivere una garanzia di deposito locativo con goCaution in conformità alla presente offerta e autorizzo goCaution a prendere le misure necessarie, in particolare a trattare con l'eventuale assicuratore precedente e a emettere una nuova polizza di deposito locativo per me e il mio locatore. A tal fine, autorizzo goCaution a trasmettere i miei dati personali e assicurativi alle parti interessate (locatore, partner di rischio). Sono consapevole che, in quanto inquilino principale, sono responsabile di informare gli altri inquilini coinvolti in questa procedura.<br /><br /><b>Confermo di aver letto e compreso le <a href='https://docs.gocaution.ch/it/terms/052024/condizioni-generali-assicurazione-cga.pdf' target='_blank'>Condizioni Generali di Assicurazione (CGA)</a> e le informazioni in esse contenute ai sensi dell'<a href='https://www.admin.ch/opc/it/classified-compilation/19080008/index.html#a3' target='_blank'>articolo 3 della legge tedesca sul contratto di assicurazione (VVG)</a>, <a href='https://docs.gocaution.ch/it/legal/lca-45.pdf' target='_blank'>il foglio informativo per il cliente ai sensi dell'art. 45 ISA</a> e di aver letto l'informativa sulla <a href='https://www.gocaution.ch/it/informativa-sulla-privacy' target='_blank'>privacy</a>.</b>"

