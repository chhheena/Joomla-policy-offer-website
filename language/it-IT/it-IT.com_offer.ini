COM_OFFER_WELCOME_TEXT ="<h4>Tre motivi che da anni parlano a favore di goCaution:</h4><ul><li>I nostri servizi, le tariffe e i termini e le condizioni sono rimasti invariati o migliorati dalla fondazione dell'azienda. E così sarà anche in futuro, perché vogliamo diventare il fornitore leader in Svizzera.</li><li>goCaution è apprezzato dagli inquilini per la semplicità dei processi e la rapida disponibilità ed è il fornitore di depositi cauzionali più popolare del settore con una valutazione complessiva di 4.9 stelle su 5 da oltre 3000 voti.</li><li>Ci occupiamo di tutto ciò che è necessario per garantire che il nuovo contratto o la modifica del contratto sia semplice e senza spese aggiuntive per voi e inviamo il nuovo certificato di deposito direttamente al vostro locatore.</li></ul>"

