COM_OFFER_NOTIFICATION_TITLE="Three reasons why you should choose to switch to Uniqa Insurance and stay with goCaution:"
COM_OFFER_NOTIFICATION_DESC="<ul><li>Our services, tariffs and terms and conditions have remained the same or improved since goCaution was founded. This will remain the case in the future. Nothing will change for you.</li><li>goCaution will valued by tenants and landlords because of its simple processes and, with over 2,600 excellent online customer reviews, is considered the most popular deposit provider in Switzerland.</li><li>goCaution remains your long-term deposit partner and takes care of everything necessary to make contract adjustments uncomplicated and easy is carried out without any additional effort for you.</li></ul>"
COM_OFFER_FAQ_MODAL_HEAD_CONTENT="Answers to questions you may be asking."
COM_OFFER_FAQ_MODAL_HEAD_CONTENT_DESC="If you have any questions or concerns, please contact us via or by phone at 0800 461 461. We will also answer inquiries by email to info@gocaution.ch outside of office hours."
COM_OFFER_FAQ_MODAL_QUES_ONE="What is the principle of the goCaution rental deposit?"
COM_OFFER_FAQ_MODAL_ANS_ONE="The tenant normally pays the rental deposit required by the landlord into a blocked bank account at a Swiss bank. This money remains blocked until the rental property is terminated and is inviolable for both the tenant and the landlord. With deposit insurance, however, there is no need to pay the rental deposit, because in return for paying an annual premium, your landlord receives a deposit certificate that secures the required rental deposit. As with the traditional rental deposit, the consent of the tenant and landlord is required to release the deposit insurance."
COM_OFFER_FAQ_MODAL_QUES_TWO="In which phases can I take out a goCaution rental deposit?"
COM_OFFER_FAQ_MODAL_ANS_TWO="You can use our rental deposit service when moving to a new apartment, or to release a bank deposit that has already been deposited or to change an existing rental deposit insurance."
COM_OFFER_FAQ_MODAL_QUES_THREE="What contractual relationships arise when you take out the goCaution® rental deposit?"
COM_OFFER_FAQ_MODAL_ANS_THREE="There is a cooperation agreement between goCaution and its risk carrier, UNIQA Insurance, regarding the coverage of the rental deposit guarantee offered here. goCaution is a tied insurance service provider within the meaning of Swiss insurance supervisory legislation, but operates its own product and offers all rental deposit insurance services independently. goCaution and UNIQA share in the premiums generated. When the contract is concluded, an insurance contract is concluded between you and goCaution or UNIQA, which guarantees your landlord a guarantee for the required rental deposit. The contract itself, which you conclude by accepting our general insurance conditions, stipulates that goCaution alone assumes responsibility for providing the service to the customer and their landlord. In return, you undertake to pay us the premium."
COM_OFFER_FAQ_MODAL_QUES_FOUR="Are there minimum terms for the deposit insurance?"
COM_OFFER_FAQ_MODAL_ANS_FOUR="No, not in principle. Our deposit insurance can be canceled at any time, provided you can provide your landlord with another equivalent security deposit for the rental agreement or if the rental agreement is terminated. The guarantee expires after your landlord returns the certificate to us. If the deposit insurance is terminated within the first 12 months, we will not refund the premium. We will only provide a pro rata refund from the second year of insurance."
COM_OFFER_FAQ_MODAL_QUES_FIVE="How do I cancel the goCaution rental deposit?"
COM_OFFER_FAQ_MODAL_ANS_FIVE="When you move out of the apartment, you basically don't have to do anything to cancel the rental deposit guarantee, as this can only be released by the landlord. The classic letter of cancellation, as is usual with other insurance products, is no longer necessary. The landlord cancels the contract by either sending us the completed and signed deposit certificate by email or post, or by giving us the release in our landlord portal, thereby releasing us from our obligation. Even if you want to replace an existing security such as a bank deposit or a deposit certificate from another provider with a deposit certificate from goCaution, you don't have to do much work. This is because goCaution contacts the landlord directly after the new deposit certificate has been sent and organizes the release of the current security for you."
COM_OFFER_FAQ_MODAL_QUES_SIX="What happens in the event of damage?"
COM_OFFER_FAQ_MODAL_ANS_SIX="If the landlord asserts claims from the rental agreement after the rental property has been handed over, which are to be offset against the goCaution rental deposit, the landlord must notify the claim. To do this, the landlord sends the deposit certificate signed by both parties back to us together with the final invoice and a copy of the rental agreement. We check the documents and pay the amount of the damage (maximum of the agreed deposit amount) to the landlord. We then demand the amount paid to the landlord back from the tenant."
COM_OFFER_FAQ_MODAL_QUES_SEVEN="Money-back guarantee"
COM_OFFER_FAQ_MODAL_ANS_SEVEN="It can happen that the rental deposit insurance you have taken out with us does not come into effect. There can be various reasons for this. Here are a few examples: your landlord does not accept the cashless rental deposit as a matter of principle and insists on a rental deposit at a bank, or your landlord accepts the cashless rental deposit but prefers another provider. In this case, we will refund the full amount of the premium you have paid. To do this, your landlord only has to release the deposit certificate we sent you by informing us in writing that the goCauton rental deposit is not required. You do not need to give written notice of termination."
COM_OFFER_FAQ_MODAL_QUES_EIGHT="How is personal data processed?"
COM_OFFER_FAQ_MODAL_ANS_EIGHT="The data collected from the natural persons who are contracting parties to the insurance contract are processed by goCaution and stored electronically. This data is used in particular to set the premium, to assess the risk, to process claims, for statistical evaluations and for advertising purposes. The data collected may, if necessary, be forwarded to the third parties involved in the contract fulfilment in Switzerland and abroad, in particular to the risk carriers and to the companies affiliated by a data processing contract. In addition, goCaution can obtain relevant information from authorities, credit agencies and other third parties, in particular about the tenant's payment behavior and the history of the claim. Detailed information on data processing can be found in goCaution's data protection declaration. The currently valid version can be found at www.gocaution.ch/datenschutz."
COM_OFFER_FAQ_MODAL_QUES_NINE="Why is a credit check carried out?"
COM_OFFER_FAQ_MODAL_ANS_NINE="We carry out the credit check to determine your ability to pay. It is integrated into the application process and is a basic requirement for granting a rental deposit guarantee. In compliance with all data protection regulations, we obtain debt collection and business information from third parties after you submit your application."
COM_OFFER_FAQ_MODAL_QUES_TEN="Who is goCaution's risk partner and what sets them apart?"
COM_OFFER_FAQ_MODAL_ANS_TEN="UNIQA Versicherung is a leading insurance company in Central and Eastern Europe and has a long history dating back to 1811. The UNIQA Group offers a wide range of insurance products and services for private individuals, companies and institutions. With UNIQA Liechtenstein, as the first Liechtenstein insurance company, we have found an agile risk carrier that supports the further development of goCaution and also enables market entry into other countries."

