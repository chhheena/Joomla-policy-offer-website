COM_OFFER_NOTIFICATION_DESC="<ul><li>Unsere Leistungen, Tarife und Geschäftsbedingungen sind seit der Gründung von goCaution gleichgeblieben oder besser geworden. Das wird auch in Zukunft so bleiben. Für Sie ändert sich dementsprechend nichts.</li><li>goCaution wird von Mietern und Vermietern wegen den einfachen Abläufen geschätzt und gilt mit über 2'600 ausgezeichneten Online-Kundenrezensionen als der beliebteste Kautionsanbieter in der Schweiz.</li><li>goCaution bleibt langfristig Ihr Kautionspartner und erledigt alles Notwendige, damit die Vertragsanpassung unkompliziert und ohne Zusatzaufwand für Sie über die Bühne geht.</li></ul>"

COM_OFFER_FAQ_MODAL_HEAD_CONTENT="Antworten auf Fragen, die Sie sich womöglich stellen."
COM_OFFER_FAQ_MODAL_HEAD_CONTENT_DESC="Bei Fragen oder Unklarheiten stehen wir Ihnen gerne auch via oder telefonisch unter 0800 461 461. Anfragen per E-Mail an info@gocaution.ch beantworten wir auch ausserhalb der Bürozeiten."
COM_OFFER_FAQ_MODAL_QUES_ONE="Was ist das Prinzip der goCaution-Mietkaution?"
COM_OFFER_FAQ_MODAL_ANS_ONE="Normalerweise bezahlt der Mieter die vom Vermieter geforderte Mietkaution auf ein Banksperrkonto einer Schweizer Bank. Dieses Geld bleibt bis zur Kündigung des Mietobjektes gesperrt und ist sowohl für den Mieter als auch für den Vermieter unantastbar. Mit der Kautionsversicherung hingegen entfällt die Einzahlung der Mietkaution, denn gegen Bezahlung einer jährlichen Prämie erhält Ihr Vermieter eine Kautionsbescheinigung, welche die geforderte Mietkaution absichert. Wie beim traditionellen Mietzinsdepot wird für die Freigabe der Kautionsversicherung das Einverständnis von Mieter und Vermieter benötigt."
COM_OFFER_FAQ_MODAL_QUES_TWO="In welchen Phasen kann ich eine goCaution-Mietkaution abschliessen?"
COM_OFFER_FAQ_MODAL_ANS_TWO="Sie können unsere Mietkautionsservice bei einem Umzug in eine neue Wohnung einsetzen, oder um eine bereits hinterlegte Bankkaution freizuschalten oder eine bestehende Mietkautionsversicherung zu wechseln."
COM_OFFER_FAQ_MODAL_QUES_THREE="Welche Vertragsbeziehungen entstehen mit dem Abschluss der goCaution® Mietkaution?"
COM_OFFER_FAQ_MODAL_ANS_THREE="Zwischen goCaution und ihrer Risikoträgerin, der UNIQA Versicherung, besteht ein Kooperationsvertrag bezüglich der Absicherung der hier angebotenen Mietkautionsgarantie. goCaution ist ein gebundener Versicherungsdienstleister im Sinne der schweizerischen Versicherungsaufsichtsgesetzgebung, betreibt jedoch ein eigenes Produkt und bietet alle Leistungen der Mietkautionsversicherung selbständig an. goCaution und UNIQA partizipieren gemeinsam an den erwirtschafteten Prämien. Zwischen Ihnen und goCaution bzw. UNIQA kommt bei Vertragsabschluss ein Versicherungsvertrag zustande, der Ihrem Vermieter eine Bürgschaft für die geforderte Mietzinskaution zusichert. Der Vertrag selbst, den Sie durch Annahme unserer Allgemeinen Versicherungsbedingungen abschliessen, sieht vor, dass ausschliesslich goCaution die Leistungserbringung gegenüber dem Kunden und seinem Vermieter übernimmt. Im Gegenzug verpflichten Sie sich, uns die Prämie zu zahlen."
COM_OFFER_FAQ_MODAL_QUES_FOUR="Gibt es Mindestlaufzeiten bei der Kautionsversicherung?"
COM_OFFER_FAQ_MODAL_ANS_FOUR="Nein, grundsätzlich nicht. Unsere Kautionsversicherung ist jederzeit kündbar, sofern Sie Ihrem Vermieter eine andere gleichwertige Sicherheitsleistung für den Mietvertrag hinterlegen können oder bei Auflösung des Mietvertrages. Die Bürgschaftsleistung erlischt nach Rücksendung der Urkunde durch Ihren Vermieter an uns. Bei Auflösung der Kautionsversicherung innerhalb der ersten 12 Monate leisten wir keine Rückerstattung der Prämie. Eine anteilsmässige Rückvergütung leisten wir erst ab dem zweiten Versicherungsjahr."
COM_OFFER_FAQ_MODAL_QUES_FIVE="Wie kündige ich die goCaution-Mietkaution?"
COM_OFFER_FAQ_MODAL_ANS_FIVE="Bei einem Auszug aus der Wohnung müssen Sie grundsätzlich nichts tun, um die Mietkautiosgarantie zu kündigen da diese ausschliesslich durch den Vermieter freigegeben werden kann. Das klassische Kündigungsschreiben, wie es bei anderen Versicherungsprodukten üblich ist, entfällt. Der Vermieter nimmt die Auflösung vor, indem er uns entweder das ausgefüllte und unterschriebene Kautionszertifikat per E-Mail oder Post zusendet oder uns die Freigabe in unserem Vermieterportal erteilt und uns damit aus der Verpflichtung entlässt. Auch wenn Sie eine bestehende Sicherheit wie ein Bankdepot oder ein Kautionszertifikat eines anderen Anbieters durch ein Kautionszertifikat von goCaution ersetzen möchten, entsteht Ihnen kein grosser Aufwand. Dies, weil goCaution nach der Übermittlung des neues Kautionszertifikat direkt mit dem Vermieter Kontakt aufnimmt und die Freigabe der heutigen Sicherheitsleistung für Sie organisiert."
COM_OFFER_FAQ_MODAL_QUES_SIX="Was passiert im Schadensfall?"
COM_OFFER_FAQ_MODAL_ANS_SIX="Macht der Vermieter nach Übergabe des Mietobjektes Ansprüche aus dem Mietverhältnis geltend, die mit der goCaution-Mietkaution verrechnet werden sollen, so hat der Vermieter die Inanspruchnahme anzuzeigen. Dazu sendet der Vermieter das von beiden Parteien unterzeichnete Kautionszertifikat zusammen mit der Schlussabrechnung und einer Kopie des Mietvertrages an uns zurück. Wir prüfen die Unterlagen und zahlen den Schadensbetrag (maximal die vereinbarte Kautionssumme) an den Vermieter aus. Den an den Vermieter gezahlten Betrag fordern wir anschliessend vom Mieter zurück."
COM_OFFER_FAQ_MODAL_QUES_SEVEN="Geld-zurück-Garantie"
COM_OFFER_FAQ_MODAL_ANS_SEVEN="Es kann vorkommen, dass die bei uns abgeschlossene Mietkautionsversicherung nicht in Kraft tritt. Dafür kann es verschiedene Gründe geben. Hier einige Beispiele: Ihr Vermieter akzeptiert die bargeldlose Mietkaution grundsätzlich nicht und besteht auf einem Mietzinsdepot bei einer Bank, oder Ihr Vermieter akzeptiert die bargeldlose Mietkaution, bevorzugt aber einen anderen Anbieter. In diesem Fall erstatten wir Ihnen die geleistete Prämie in voller Höhe zurück. Dazu muss Ihr Vermieter lediglich das von uns zugesandte Kautionszertifikat freigeben, indem er uns schriftlich mitteilt, dass die goCauiton-mietkaution nicht benötigt wird. Eine schriftliche Kündigung Ihrerseits ist nicht erforderlich."
COM_OFFER_FAQ_MODAL_QUES_EIGHT="Wie werden personenbezogene Daten verarbeitet?"
COM_OFFER_FAQ_MODAL_ANS_EIGHT="Die von den natürlichen Personen, die Vertragsparteien des Versicherungsvertrages sind, gesammelten Daten werden von goCaution bearbeitet und elektronisch geschützt aufbewahrt. Diese Daten werden insbesondere zur Festsetzung der Prämie, zur Risikoabklärung, zur Bearbeitung von Schadenfällen, für statistische Auswertungen und zu Werbezwecken verwendet. Die gesammelten Daten können gegebenenfalls im erforderlichen Umfang an die an der Vertragserfüllung beteiligten Dritten im In- und Ausland weitergeleitet werden, insbesondere an die Risikoträger und an die durch einen Auftragsverarbeitungsvertrag verbundenen Unternehmen. Darüber hinaus kann goCaution bei Behörden, Auskunfteien und sonstigen Dritten sachdienliche Auskünfte, insbesondere über das Zahlungsverhalten des Mieters und den Schadensverlauf, einholen. Detaillierte Informationen zur Datenbearbeitung sind in der Datenschutzerklärung von goCaution enthalten. Die jeweils gültige Fassung ist unter www.gocaution.ch/datenschutz abrufbar."
COM_OFFER_FAQ_MODAL_QUES_NINE="Warum wird eine Bonitätsprüfung durchgeführt?"
COM_OFFER_FAQ_MODAL_ANS_NINE="Die Bonitätsprüfung führen wir durch, um Ihre Zahlungsfähigkeit festzustellen. Sie ist in den Antragsprozess integriert und Grundvoraussetzung für die Gewährung einer Mietkautionsgarantie. Unter Einhaltung aller datenschutzrechtlichen Bestimmungen holen wir nach Ihrer Antragstellung Betreibungs- und Wirtschaftsauskünfte bei Drittanbietern ein."
COM_OFFER_FAQ_MODAL_QUES_TEN="Wer ist die Risikopartnerin von goCaution und was zeichnet sie aus?"
COM_OFFER_FAQ_MODAL_ANS_TEN="Die UNIQA Versicherung ist ein führendes Versicherungsunternehmen in Zentral- und Osteuropa und verfügt über eine lange Geschichte, die bis ins Jahr 1811 zurückreicht. Die UNIQA Gruppe bietet eine breite Palette von Versicherungsprodukten und -dienstleistungen für Privatpersonen, Unternehmen und Institutionen an. Mit UNIQA Liechtenstein, als erste Liechtensteinische Versicherungsgesellschaft, haben wir eine agile Risikoträgerin gefunden, welche die Weiterentwicklung von goCaution unterstützt und auch den Markteintritt in andere Länder ermöglicht."

