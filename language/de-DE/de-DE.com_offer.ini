COM_OFFER_AGREEMENT_CONTENT="Ich erkläre mich damit einverstanden, eine Mietkautionsgarantie gemäss vorliegender Offerte bei goCaution abzuschliessen und bevollmächtige sie, die notwendigen Schritte, insbesondere die Abwicklung mit einem allfälligen Vorversicherer zu vollziehen und mir und meinem Vermieter eine neue Mietkautionspolice auszustellen. Hierzu erteile ich goCaution mein  Einverständnis, meine personenbezogenen und versicherungstechnischen Daten an die involvierten Stellen (Vermieter,  Risikopartner) zu übermitteln. Mir ist bewusst, dass ich als Hauptmieter dafür verantwortlich bin, die weiteren involvierten Mieter über diesen Vorgang zu informieren.<br /><br /><b>Ich bestätige, die <a href='https://docs.gocaution.ch/de/terms/052024/allgemeine-versicherungsbedingungen-avb.pdf' target='_blank'>Allgemeinen Vertragsbedingungen (AVB)</a> und die darin enthaltenen Informationen nach <a href='https://www.admin.ch/opc/de/classified-compilation/19080008/index.html#a3' target='_blank'>Artikel 3 Versicherungsvertragsgesetz (VVG)</a>, <a href='https://docs.gocaution.ch/de/legal/vag-45.pdf' target='_blank'>das Kunden-Informationsblatt gemäss Art. 45 VAG</a> sowie die Hinweise zum <a href='https://www.gocaution.ch/de/datenschutzbestimmungen' target='_blank'>Datenschutz</a> gelesen zu haben.</b>"

